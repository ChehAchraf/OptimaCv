name: Docker CI/CD

on:
  push:
    branches:
    - main

env:
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
  BACKEND_IMAGE: mohammedlahlali/optimacv-backend
  FRONTEND_IMAGE: mohammedlahlali/optimacv-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_PASSWORD }}

    - name: Build backend Docker image
      run: docker build -f backend/Dockerfile -t $BACKEND_IMAGE:latest ./backend

    - name: Push backend image
      run: docker push $BACKEND_IMAGE:latest

    - name: Build frontend Docker image
      run: docker build -f frontend/Dockerfile -t $FRONTEND_IMAGE:latest ./frontend

    - name: Push frontend image
      run: docker push $FRONTEND_IMAGE:latest
