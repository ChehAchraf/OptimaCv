version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/dockerfile
    container_name: optima-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./:/app

  frontend:
    build:
      context: .
      dockerfile: frontend/dockerfile
    container_name: optima-frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
