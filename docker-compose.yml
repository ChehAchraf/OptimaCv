services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: optimacv_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - PYTHONUNBUFFERED=1
      - WATCHFILES_FORCE_POLLING=true

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: optimacv_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - INTERNAL_API_BASE_URL=http://backend:8000/api/v1
      - NEXT_PUBLIC_APP_BASE_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  frontend_node_modules:
