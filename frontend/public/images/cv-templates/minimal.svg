<svg width="300" height="400" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="400" fill="white" stroke="#e5e7eb" stroke-width="2"/>
  
  <!-- Header section -->
  <rect x="20" y="20" width="260" height="1" fill="#e5e7eb"/>
  
  <!-- Profile photo (small, centered) -->
  <circle cx="150" cy="45" r="15" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  
  <!-- Name and title (centered) -->
  <rect x="100" y="75" width="100" height="10" fill="#1f2937" rx="2"/>
  <rect x="110" y="90" width="80" height="6" fill="#6b7280" rx="2"/>
  
  <!-- Contact info (centered) -->
  <rect x="50" y="110" width="40" height="4" fill="#9ca3af" rx="1"/>
  <rect x="100" y="110" width="45" height="4" fill="#9ca3af" rx="1"/>
  <rect x="155" y="110" width="50" height="4" fill="#9ca3af" rx="1"/>
  <rect x="215" y="110" width="35" height="4" fill="#9ca3af" rx="1"/>
  
  <!-- Bottom border for header -->
  <rect x="20" y="130" width="260" height="1" fill="#d1d5db"/>
  
  <!-- Summary section -->
  <rect x="20" y="150" width="60" height="6" fill="#374151" rx="2"/>
  <rect x="20" y="155" width="260" height="1" fill="#e5e7eb"/>
  <rect x="20" y="170" width="240" height="3" fill="#9ca3af" rx="1"/>
  <rect x="20" y="178" width="250" height="3" fill="#9ca3af" rx="1"/>
  <rect x="20" y="186" width="200" height="3" fill="#9ca3af" rx="1"/>
  
  <!-- Experience section -->
  <rect x="20" y="210" width="70" height="6" fill="#374151" rx="2"/>
  <rect x="20" y="215" width="260" height="1" fill="#e5e7eb"/>
  
  <!-- Job 1 -->
  <rect x="20" y="235" width="120" height="5" fill="#1f2937" rx="1"/>
  <rect x="200" y="237" width="60" height="3" fill="#9ca3af" rx="1"/>
  <rect x="20" y="245" width="80" height="4" fill="#6b7280" rx="1"/>
  <rect x="25" y="255" width="3" height="20" fill="#f3f4f6"/>
  <rect x="35" y="258" width="220" height="3" fill="#9ca3af" rx="1"/>
  <rect x="35" y="266" width="200" height="3" fill="#9ca3af" rx="1"/>
  
  <!-- Education section -->
  <rect x="20" y="290" width="70" height="6" fill="#374151" rx="2"/>
  <rect x="20" y="295" width="260" height="1" fill="#e5e7eb"/>
  <rect x="20" y="310" width="100" height="5" fill="#1f2937" rx="1"/>
  <rect x="180" y="312" width="80" height="3" fill="#9ca3af" rx="1"/>
  <rect x="20" y="320" width="90" height="4" fill="#6b7280" rx="1"/>
  
  <!-- Skills section (2 columns) -->
  <rect x="20" y="345" width="50" height="6" fill="#374151" rx="2"/>
  <rect x="160" y="345" width="60" height="6" fill="#374151" rx="2"/>
  <rect x="20" y="350" width="120" height="1" fill="#e5e7eb"/>
  <rect x="160" y="350" width="120" height="1" fill="#e5e7eb"/>
  
  <rect x="20" y="365" width="80" height="3" fill="#9ca3af" rx="1"/>
  <rect x="20" y="373" width="70" height="3" fill="#9ca3af" rx="1"/>
  
  <rect x="160" y="365" width="90" height="3" fill="#9ca3af" rx="1"/>
  <rect x="160" y="373" width="85" height="3" fill="#9ca3af" rx="1"/>
  
  <!-- Template name -->
  <text x="150" y="395" font-family="Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Minimal</text>
</svg>